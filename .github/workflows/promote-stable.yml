name: Promote Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to promote (e.g. 1.2.0)"
        required: true
        type: string

# 跟 canary-deploy 共享同一个互斥锁
concurrency:
  group: canary-deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 质量前置门：monitor 说不达标就不许晋级。
  # 这是 docs/CD-pipeline.md §10 第 4 条遗留项（"观察期没有自动化告警，promote
  # 完全靠人主观判断观察够了没"）的正解——把判据从"人觉得可以了"换成
  # "线上评分达标了"。
  #
  # 必须跑在 self-hosted 上：monitor 要访问 localhost:6006 的 Phoenix。
  # 下面的 promote job 仍跑 ubuntu-latest（它只调 Railway / Cloudflare API）。
  gate:
    runs-on: [self-hosted, bz-rag-local]
    timeout-minutes: 15
    env:
      # 只写大写这一个：GitHub 的 env 键名大小写不敏感，同时写 NO_PROXY 与
      # no_proxy 会被判成重复定义、整个文件被拒收（eval-gate.yml 上实测踩过）。
      NO_PROXY: localhost,127.0.0.1
      PHOENIX_ENDPOINT: http://localhost:6006
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ run 块必须纯 ASCII：GitHub 把它写成 UTF-8 无 BOM 的 .ps1，
      # powershell 5.1 在代码页 936 下按 GBK 解码，中文含非法 GBK 序列会吃掉
      # 字符串终止符，报出与真因无关的 Missing closing '}'。
      - name: Reuse venv
        run: |
          $venv = Join-Path $env:RUNNER_WORKSPACE "_venv"
          if (-not (Test-Path (Join-Path $venv "Scripts\python.exe"))) {
            Write-Host "::error::venv not found at $venv. Run the Eval Gate workflow once first."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $venv "Scripts") -Encoding utf8

      # 这里**不**用 continue-on-error：前置门就是要在非 promote 时挡住。
      # hold（exit 2）同样挡住——样本不足意味着还判不了，此时晋级是赌博。
      - name: Quality gate
        run: |
          python -m evaluation.phoenix.monitor --project bz-rag-canary --window-minutes 180
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host "monitor says promote - gate passed"
          } elseif ($code -eq 2) {
            Write-Host "::error::monitor says HOLD (not enough samples). Let the canary run longer, then retry."
            exit 1
          } else {
            Write-Host "::error::monitor says ROLLBACK (criteria not met). Promotion refused."
            exit 1
          }

  promote:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Step 1: 先把 100% 流量切到 canary，stable 这时候没有流量可以放心更新
      - name: Shift all traffic to canary
        run: |
          chmod +x ./scripts/cf-kv-update.sh
          ./scripts/cf-kv-update.sh 100

      # Step 2: 给 stable service 打上新版本号
      - name: Set APP_VERSION on stable service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set APP_VERSION="v${{ inputs.version }}" \
            -s "${{ secrets.RAILWAY_SERVICE_ID_STABLE }}" \
            -e "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" \
            --skip-deploys

      # Step 3: 部署新版本到 stable（此时 stable 没有外部流量打进来）
      - name: Deploy stable
        timeout-minutes: 15
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          VERSION="v${{ inputs.version }}"
          DEPLOY_MESSAGE="Deploy stable ${VERSION} (${SHA}) by ${ACTOR}"

          echo "Deploying ${VERSION} to stable..."

          railway up \
            -p "${{ secrets.RAILWAY_PROJECT_ID }}" \
            -s "${{ secrets.RAILWAY_SERVICE_ID_STABLE }}" \
            -e "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" \
            -m "${DEPLOY_MESSAGE}" \
            --ci \
            --json > deploy.log 2>&1 &
          RAILWAY_PID=$!

          FAIL_PATTERN="canceled|failed to solve|context canceled|Deploy failed|no changes detected"
          SUCCESS_PATTERN='"status":\s*"(SUCCESS|success)"'
          while kill -0 "$RAILWAY_PID" 2>/dev/null; do
            if grep -qiE "$FAIL_PATTERN" deploy.log 2>/dev/null; then
              echo "ERROR: Railway build failed or was skipped!"
              cat deploy.log
              kill "$RAILWAY_PID" 2>/dev/null || true
              exit 1
            fi
            if grep -qE "$SUCCESS_PATTERN" deploy.log 2>/dev/null; then
              echo "Railway deploy succeeded."
              kill "$RAILWAY_PID" 2>/dev/null || true
              break
            fi
            sleep 2
          done

          wait "$RAILWAY_PID" 2>/dev/null || true
          cat deploy.log

          if grep -qiE "$FAIL_PATTERN" deploy.log; then
            echo "ERROR: Railway build failed or was skipped!"
            exit 1
          fi

          # 白名单判定：必须**明确看到**成功标志才算成功。
          # 2026-09-11 实测的教训：Railway trial 到期时返回
          #   {"code":"UPLOAD_FAILED","error":"Your trial has expired. ..."}
          # 这串字符一个都不匹配 FAIL_PATTERN，于是上面那个黑名单检查放行，
          # 脚本打印"deployment submitted successfully"，把失败一路推到 4 分钟后的
          # 健康检查才炸——而且报出来的症状（服务起不来）和真实原因（压根没上传）
          # 完全不沾边，排查时严重误导。
          #
          # 黑名单注定漏：配额、鉴权、网络、限流……每一种新错误都得回来补一次正则。
          # 反过来做才对：没看到 "status": "SUCCESS" 就一律判失败。
          # 代价是 railway 改输出格式时会误报失败，但那种失败会立刻带着 deploy.log
          # 全文炸在眼前，比"以为部署了其实没部署"安全得多。
          if ! grep -qE "$SUCCESS_PATTERN" deploy.log; then
            echo "ERROR: deploy.log 里没有出现成功标志（\"status\": \"SUCCESS\"），判定部署失败。"
            echo "       上面的 deploy.log 全文就是 Railway 的原始回包，看它说了什么。"
            exit 1
          fi

          echo "Stable deployment submitted successfully."

      # Step 4: 验证 stable 起来了 + 跑的是新版本
      - name: Wait for stable health
        timeout-minutes: 5
        run: |
          chmod +x ./scripts/wait-for-health.sh
          ./scripts/wait-for-health.sh \
            "https://bz-rag-stable-production.up.railway.app/api/health" \
            "${{ inputs.version }}" \
            240

      # Step 5: 流量全部回到 stable（canary 闲置，等下次 canary-deploy 拉新版本）
      - name: Route all traffic back to stable
        run: |
          chmod +x ./scripts/cf-kv-update.sh
          ./scripts/cf-kv-update.sh 0
