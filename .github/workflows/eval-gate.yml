name: Eval Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  eval:
    # 安全守卫：本仓库是 **public**，而本 job 跑在 self-hosted runner（作者的工作机）上。
    # 这是 GitHub 明确警告的组合——任何人 fork 之后提 PR，其 workflow 就会在这台机器上
    # 执行代码，而公开仓库能用的只有"首次贡献者需审批"这一层弱防护（老贡献者不受限，
    # 且 Settings > Actions 里 private 仓库才有的 access policy 对 public 仓库返回 422）。
    # 这里把 pull_request 事件限制为「PR 源分支在本仓库内」，fork 来的 PR 直接跳过本 job。
    # push 事件不加限制：能推 master 的本来就得有写权限。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # 真管线依赖本机 Milvus(19530) 与本机 Phoenix(6006)，云 runner 碰不到，
    # 所以必须钉在装了这两个服务的机器上（标签 bz-rag-local）。
    runs-on: [self-hosted, bz-rag-local]
    # I5（最终整支 review）：实测 smoke 3 条 88.37s（含约 17s 收集），约 24s/case；
    # 全量 48 项（24 case × 2 repetitions）据此估算约 19-20 分钟，再加上
    # `pip install -r requirements.txt`（+ requirements-eval.txt）很容易顶到原来
    # 的 30 分钟上限——一旦被 timeout 杀掉，job 中途死掉不会留下记分卡也不会有
    # acceptance 判定（conftest.py 的 pytest_sessionfinish 根本没机会跑），只剩
    # 一个无信息量的红，比一次真实的 acceptance 失败更难排查。按实测吞吐量
    # （24s/case × 48 + 依赖安装）留出余量，提到 45 分钟。
    # 2026-09-09 从 45 提到 80：上面那个 24s/case 的估算偏乐观了。本机实测
    # 24 条 1 轮跑了 1548 秒 = 64.5s/case（BM25 修复后混合检索真正生效，
    # 稀疏那一路不再空转，检索耗时本来就上去了）。push 事件 EVAL_REPETITIONS=2
    # 即 48 项，按实测推算约 52 分钟，45 分钟必被 timeout 杀掉——而 job 被
    # timeout 中途杀死不会留下记分卡（conftest.py 的 pytest_sessionfinish 没机会
    # 跑），只剩一个无信息量的红，比一次真实的 acceptance 失败更难排查。
    timeout-minutes: 80
    env:
      # 只写大写这一个。GitHub Actions 的 env 键名**大小写不敏感**，同时写
      # NO_PROXY 和 no_proxy 会被判成重复定义，整个 workflow 文件被拒：
      #   Invalid workflow file: (Line: 36, Col: 7): 'no_proxy' is already defined
      # 这个错误只在 GitHub 侧出现——本地 PyYAML / ruamel 都能正常解析（它们按
      # 字符逐一比对键名，两者不同），所以直到门禁第一次真在 CI 上跑才暴露，
      # 表现是「启动期失败、0 个 job、workflow 名回退成文件路径」。
      # 不影响功能：Windows 的环境变量本身大小写不敏感，NO_PROXY 一个就覆盖了。
      # （Python 侧 os.environ.setdefault 那两行是给 Linux 准备的，与此无关。）
      NO_PROXY: localhost,127.0.0.1
      PHOENIX_ENDPOINT: http://localhost:6006
      PHOENIX_COLLECTOR_ENDPOINT: http://localhost:6006
      PHOENIX_PROJECT_NAME: bz-rag-ci
      # M4（最终整支 review）：这台 runner 的 Python 进程往被 GitHub Actions 重定向
      # 的管道（非交互式终端）写 stdout 时，默认按本机 ANSI 代码页（cp936/GBK）
      # 编码，而 GitHub 按 UTF-8 渲染日志——acceptance.py 记分卡里的 "└─" 和全角
      # 逗号会被转义成乱码（实测：不设这个变量时 Git Bash 管道捕获到的输出确实是
      # "????"；设了之后同一条命令输出正常，参见 docs/CD-pipeline.md 的校验记录）。
      # 这个变量对 pytest 自己的 TerminalWriter 同样生效（已实测验证，不只是对
      # print），比把记分卡里的字符换成纯 ASCII 更省事，且不用动 acceptance.py
      # 里已经权衡过可读性的输出格式。
      PYTHONIOENCODING: utf-8
      # 并发跑同名 dataset 会互相 prune 例子（Arize 官方明说），按源分支隔离。
      # 注意不能直接用 github.ref_name：PR 事件下它是 "<PR号>/merge"（带斜杠，
      # 且不是分支名），所以优先取 head_ref（只有 PR 事件才有值，就是源分支名），
      # push 事件下 head_ref 为空则回退到 ref_name（此时它就是分支名）。
      PHOENIX_TEST_DATASET: bz-rag-golden-${{ github.head_ref || github.ref_name }}
      # PR 只跑 smoke 子集控制判官调用量；master 跑全量并重复 2 次压方差。
      EVAL_REPETITIONS: ${{ github.event_name == 'pull_request' && '1' || '2' }}
      # 凭证必须显式注入。这里原先写的是「有意不放 GitHub Secrets：runner 跑在
      # 本机，load_dotenv() 会读到仓库根目录下（已 gitignore 的）.env」——**那个
      # 推理是错的**，而且因为 runner 一直没注册、门禁从没在 CI 上真跑过，这个洞
      # 一直没暴露。runner 每次 actions/checkout 出来的是全新工作目录
      # （C:\actions-runner\_work\BZ-RAG\BZ-RAG），.env 在 .gitignore 里不会进
      # checkout，find_dotenv() 一路往上也找不到。实测：对仓库做一次干净 clone
      # 后 import evaluation.phoenix.evaluators，直接抛
      # 「RuntimeError: 判官配置缺失：JUDGE_OPENAI_API_KEY, ...」——门禁会在 pytest
      # 收集阶段就红，报错原因与被测质量毫无关系。
      #
      # 七个都走 Repository secrets（Settings > Secrets and variables > Actions）：
      #   OPENAI_API_KEY / OPENAI_BASE_URL / MODEL_ID
      #   ZHIPUAI_API_KEY
      #   JUDGE_OPENAI_API_KEY / JUDGE_OPENAI_BASE_URL / JUDGE_MODEL_ID
      #
      # 端点与模型名本身并不敏感，按理更适合放 Variables 让它们在日志里可见——
      # 判官供应商漂移是本项目已知的可比性风险（见设计文档 §8），模型名被掩成
      # *** 会让排查变难。这里仍统一走 Secrets，是因为它们已经配在 Secrets 里了，
      # 迁就现状比返工划算；可见性的损失有替代来源：test_rag_eval.py 的
      # experiment_metadata 会把 JUDGE_MODEL_ID 写进 Phoenix 的 experiment，
      # 在 Phoenix UI 上查得到，不依赖 CI 日志。
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
      JUDGE_OPENAI_API_KEY: ${{ secrets.JUDGE_OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      MODEL_ID: ${{ secrets.MODEL_ID }}
      JUDGE_OPENAI_BASE_URL: ${{ secrets.JUDGE_OPENAI_BASE_URL }}
      JUDGE_MODEL_ID: ${{ secrets.JUDGE_MODEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 放在 pip install 之前：缺变量时立刻红，省掉两分钟依赖安装，且错误信息
      # 直接点名缺哪个。否则症状是 pytest 收集阶段抛「判官配置缺失」（只覆盖
      # JUDGE_* 三个），而 MODEL_ID / ZHIPUAI_API_KEY 缺失还要更晚、在第一次真调
      # 管线时才炸，报错离真因更远。
      # 有意**不写** `shell:`，跟本 job 其它步骤一样走 Windows 默认 shell。
      # 这一步最初写成 `shell: bash`，在 CI 上直接失败：
      #   <3>WSL (...) ERROR: CreateProcessCommon:818: execvpe(/bin/bash) failed
      # GitHub 在 Windows 上解析 `shell: bash` 时按 PATH 找 bash，而这台机器
      # PATH 里第一个是 C:\Windows\system32\bash.exe——WSL 的启动器，且 WSL 里
      # 没装发行版，所以 /bin/bash 不存在。这台 runner 也没装 pwsh，
      # GitHub 的默认 shell 是 powershell.exe 5.1，故下面按 5.1 语法写
      # （不用三元运算符、不用 ??，它们在 5.1 里不存在）。
      - name: Preflight - 校验凭证已注入
        run: |
          $required = @(
            'OPENAI_API_KEY', 'ZHIPUAI_API_KEY', 'JUDGE_OPENAI_API_KEY',
            'OPENAI_BASE_URL', 'MODEL_ID', 'JUDGE_OPENAI_BASE_URL', 'JUDGE_MODEL_ID'
          )
          $missing = @()
          foreach ($v in $required) {
            $val = [Environment]::GetEnvironmentVariable($v)
            if ([string]::IsNullOrWhiteSpace($val)) { $missing += $v }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::缺少以下 Repository secret：$($missing -join ', ')"
            Write-Host "在仓库 Settings > Secrets and variables > Actions > Secrets 里补齐。"
            Write-Host "注意作用域：必须是 Repository secrets。放进某个 Environment 的"
            Write-Host "secret 只有当 job 声明了 environment: <名字> 时才可见，本 job 没有声明。"
            exit 1
          }
          # 不回显具体值：七个都是 secret，GitHub 会把值掩成 ***，打印出来没信息量。
          # 判官模型名要查的话看 Phoenix experiment 的 metadata.judge。
          Write-Host "七个凭证均已注入。"

      # runner 本机装的是 Python 3.14.3（C:\Python314），不用 actions/setup-python：
      # 那会去装另一个版本，且 self-hosted runner 未必有权限/网络联网装 Python。
      # 注意：这一步是否是"廉价空操作"取决于 runner 服务实际以哪个 Windows 账户
      # 运行——依赖装在了 ci24871 的 per-user site-packages 下，见 docs/CD-pipeline.md
      # 对应条目；账户不对时这里会从零重装 torch/transformers/langchain/mlflow 等，
      # 且可能与 timeout-minutes（见上，当前 45 分钟）抢时间。
      # I2（最终整支 review）：requirements.txt 只装生产运行时真正需要的依赖；
      # 评估门禁专用的重依赖（Phoenix 服务端全家桶、判官/pytest 插件、pyyaml）
      # 拆进 requirements-eval.txt，避免 railway.toml 用 NIXPACKS 构建生产镜像时
      # 把它们一起装进去（docs/CD-pipeline.md Q1 记着 torch 撞过 build OOM，这些
      # 包同样体积可观，且生产运行时的 api/milvus_rag_phoenix.py 只 import
      # phoenix.otel.register，用不到它们）。
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-eval.txt

      # phoenix.otel.register() 不做连通性检查：Phoenix 宕机时它依然返回成功，
      # trace 却零产出，所以这一步不能省。打 /readyz 而不是根路径：根路径乃至
      # 任意不存在的路径都被前端 SPA 的 catch-all 兜成 200，只能证明"6006 端口
      # 上有 HTTP server"；/readyz 是 Phoenix 自己暴露的就绪探针（服务端内部真的
      # 执行一次 select 1 探数据库连通性），能覆盖"进程活着但连不上库、记不了
      # trace"这个真实失败模式。带超时，避免 Phoenix 没起来时卡死 job。
      # 必须写 curl.exe 而不是 curl：这台 runner 的默认 shell 是 powershell.exe 5.1，
      # 里面 `curl` 是 **Invoke-WebRequest 的别名**（PowerShell 6+ 才移除了这个别名），
      # 会把下面这串 Unix 风格参数当成 Invoke-WebRequest 的参数解析而失败。
      # 输出目标同理用 NUL 而不是 /dev/null。
      - name: Check Phoenix is up
        run: |
          $code = & curl.exe -s -o NUL -w "%{http_code}" --max-time 10 http://localhost:6006/readyz
          Write-Host "phoenix /readyz -> $code"
          if ($code -ne "200") {
            Write-Host "::error::Phoenix 未就绪（/readyz 返回 $code）。这台 runner 上要先起 Phoenix："
            Write-Host "  powershell -File scripts/phoenix-up.ps1"
            exit 1
          }

      # --import-mode=importlib 是必需的：evaluation/phoenix/ 这个目录名和已安装的
      # phoenix 包在 pytest 默认 prepend 模式下冲突，会在 conftest 加载阶段就
      # ModuleNotFoundError 崩掉（见 docs/CD-pipeline.md 对应条目），不加这个 flag
      # 两条门禁命令都跑不起来，且报错跟真因几乎无法联想到一起。
      # 观测态已于 2026-09-09 结束，两步的 continue-on-error 已摘除，门禁重新
      # 阻断 PR / push。C1 当初判定"基线上就恒红"的两条 criteria
      # （answer_relevancy/average、refusal_check/pass_rate）根因查清后都在管线侧，
      # 不在阈值侧——修完三个 bug（重排倒序 + top_n 服务端截断、RERANK_TOP_K 余量
      # 太薄、BM25 中文分词未配）后全量 24 条五条 criteria 全 PASS，
      # **criteria.yaml 的阈值一个都没有下调**。详见 docs/CD-pipeline.md §4.5。
      #
      # 退出码约定：acceptance 未达标时 conftest 把退出码改写成 6（不用 3，
      # 那是 pytest 的 INTERNAL_ERROR，怕下游 CI 特判成基础设施抖动自动重跑）。
      - name: Run eval gate (PR = smoke subset)
        if: github.event_name == 'pull_request'
        run: pytest evaluation/phoenix -o addopts="" --import-mode=importlib -m smoke -q

      - name: Run eval gate (master = full)
        if: github.event_name == 'push'
        run: pytest evaluation/phoenix -o addopts="" --import-mode=importlib -q
